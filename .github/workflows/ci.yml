name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-tiaoxiu-signal
  cancel-in-progress: true

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -q -r requirements.txt

      - name: Reproduce all numbers
        run: bash run_all.sh

      - name: Verify machine outputs and regenerated summary
        run: |
          python - <<'PY'
          import json, pathlib
          paths = [
              "results/results.json",
              "results/robustness.json",
              "results/extra_checks.json",
              "results/mechanism.json",
              "results/capture.json",
          ]
          for path in paths:
              text = pathlib.Path(path).read_text()
              json.loads(text, parse_constant=lambda x: (_ for _ in ()).throw(ValueError(f"non-standard JSON constant {x} in {path}")))
          summary = pathlib.Path("results/SUMMARY.md").read_text()
          assert "- apache: s=" in summary
          print("machine outputs: strict JSON OK; summary regenerated")
          PY

      - name: Upload figures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: figures
          path: figures/*.png
          if-no-files-found: ignore

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results
          path: results/
          if-no-files-found: ignore
